version: 2

# Security updates only. open-pull-requests-limit: 0 turns version updates
# off (GitHub docs: security updates are not affected by it), so Dependabot
# opens a PR only when a dependency has a known vulnerability. Major upgrades
# are done on purpose, not on a schedule. The minor/patch ignores stay as a
# second guard. Each entry repeats the rule (no YAML anchors).
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@types/node"
        versions: [">=25"]
      # marked v18 changed renderer.heading API — migrate lib/markdown.ts first.
      - dependency-name: marked
        versions: [">=13"]

  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: pip
    directory: /nlp-service
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # chromadb 0.4.24 requires numpy<2; 0.5+ / 1.x need deliberate migration (vector_store API).
      - dependency-name: chromadb
        versions: [">=0.5.0"]
      - dependency-name: numpy
        versions: [">=2.0.0"]
      # transformers >=5.10 imports torch.float8_e8m0fnu; torch 2.6.0 lacks it.
      - dependency-name: transformers
        versions: [">=5.10.0"]
      # pyrate-limiter 4.x API change; defer until rate-limiter path is retested.
      - dependency-name: pyrate-limiter
        versions: [">=4.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # Docker base images are pinned by digest and keep every update: digest
  # bumps are how Node.js and Debian security patches reach the images, and
  # Dependabot never raises those as security updates.
  - package-ecosystem: docker
    directory: /nlp-service
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0

